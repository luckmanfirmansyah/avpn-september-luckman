<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enterprise Network AI Assistant | Gemini</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <!-- Marked.js for Markdown parsing & DOMPurify for security -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>

  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="app-wrapper">
    <!-- Chat Card Container -->
    <main class="chat-container">

      <!-- Header -->
      <header class="chat-header">
        <div class="bot-profile">
          <div class="avatar-wrapper">
            <div class="bot-avatar">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect>
                <rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect>
                <line x1="6" y1="6" x2="6.01" y2="6"></line>
                <line x1="6" y1="18" x2="6.01" y2="18"></line>
              </svg>
            </div>
            <span class="status-indicator" title="Backend Server Terhubung"></span>
          </div>
          <div class="bot-info">
            <div class="bot-name-row">
              <h1 class="bot-name">Senior Network AI</h1>
              <span class="badge-tag">Enterprise</span>
            </div>
            <p class="bot-status">Siap membantu konfigurasi & arsitektur jaringan</p>
          </div>
        </div>

        <div class="header-actions">
          <button id="clear-chat-btn" class="btn-secondary" title="Hapus riwayat sesi lokal" type="button">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
              <line x1="10" y1="11" x2="10" y2="17"></line>
              <line x1="14" y1="11" x2="14" y2="17"></line>
            </svg>
            <span>Reset Sesi</span>
          </button>
        </div>
      </header>

      <!-- Chat History Area -->
      <section id="chat-box" class="chat-box" aria-live="polite">
        <!-- Messages will be dynamically rendered here -->
      </section>

      <!-- Input Area -->
      <footer class="chat-footer">
        <form id="chat-form" class="chat-form">
          <div class="input-wrapper">
            <textarea id="user-input" rows="1"
              placeholder="Tanyakan masalah jaringan, konfigurasi Cisco, VLAN, routing, BGP..." autocomplete="off"
              required></textarea>
            <button type="submit" id="send-btn" class="btn-send" title="Kirim Pesan (Enter)">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
              </svg>
            </button>
          </div>
        </form>
        <div class="footer-meta">
          <span class="meta-item">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            Sesi otomatis tersimpan di Local Storage
          </span>
          <span class="meta-item">Tekan <kbd>Enter</kbd> untuk kirim, <kbd>Shift + Enter</kbd> untuk baris baru</span>
        </div>
      </footer>

    </main>
  </div>

  <script src="script.js"></script>
</body>

</html>
